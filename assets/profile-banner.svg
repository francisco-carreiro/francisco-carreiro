<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Francisco Carreiro — Full-Stack Developer and Digital Creator</title>
<desc id="desc">Dark engineering-themed banner with crimson accents and a code-inspired panel.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop stop-color="#0A0F19"/>
    <stop offset=".6" stop-color="#131C2A"/>
    <stop offset="1" stop-color="#10151F"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop stop-color="#E44858"/>
    <stop offset=".75" stop-color="#D84850" stop-opacity=".4"/>
    <stop offset="1" stop-color="#D84850" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#9CAFC3" stroke-opacity=".075" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
