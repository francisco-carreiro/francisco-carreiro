<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 418" width="1100" height="418" role="img" aria-labelledby="title desc">
<title id="title">Release the Kraken — Francisco's animated ASCII command center</title>
<desc id="desc">Original ASCII kraken rises among looping waves, tentacles cycle through three hand-drawn shapes, bubbles rise, and a fictional developer console celebrates design, build and ship. Reduced-motion settings show a static composition.</desc>
<defs>
<linearGradient id="ocean" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090F1B"/><stop offset=".64" stop-color="#111F2E"/><stop offset="1" stop-color="#101621"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#E56373"/><stop offset="1" stop-color="#E56373" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#A8B9CC" stroke-opacity=".055" fill="none"/></pattern>
<clipPath id="sea"><rect x="24" y="333" width="623" height="59"/></clipPath>
</defs>

<style>
.mono,.ascii{font-family:'Cascadia Code',Consolas,'Liberation Mono',monospace}
.ascii{font-size:17px;font-weight:600;fill:#D8E8F1;letter-spacing:0;white-space:pre}
.eye{fill:#FA7584;animation:eye 6s steps(1,end) infinite}
.pose-a{opacity:1;animation:poseA 6s steps(1,end) infinite}
.pose-b{opacity:0;animation:poseB 6s steps(1,end) infinite}
.pose-c{opacity:0;animation:poseC 6s steps(1,end) infinite}
.core{animation:float 6s ease-in-out infinite}
.tentacles-left{animation:swayL 5s ease-in-out infinite}
.tentacles-right{animation:swayR 5.4s ease-in-out infinite}
.wave{font:19px Consolas,'Liberation Mono',monospace;letter-spacing:2px;white-space:pre;animation:wave 10s linear infinite}
.wave-back{fill:#447D91;opacity:.78}
.wave-front{fill:#DF6676;opacity:.58;animation-duration:13s;animation-direction:reverse}
.bubble{font:14px Consolas,monospace;fill:#75AFC3;animation:rise 5s ease-in-out infinite;opacity:0}
.bubble.two{animation-delay:1.8s}.bubble.three{animation-delay:3.1s}
.cursor{animation:blink 1s steps(1,end) infinite}
.radar{animation:pulse 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes swayL{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes swayR{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
@keyframes poseA{0%,32.99%{opacity:1}33%,100%{opacity:0}}
@keyframes poseB{0%,32.99%{opacity:0}33%,65.99%{opacity:1}66%,100%{opacity:0}}
@keyframes poseC{0%,65.99%{opacity:0}66%,100%{opacity:1}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-85px)}}
@keyframes rise{0%,5%{opacity:0;transform:translateY(0)}20%,75%{opacity:.75}100%{opacity:0;transform:translateY(-70px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes eye{0%,43%,52%,100%{fill:#FA7584}44%,51%{fill:#F4D9D9}}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important}
.pose-a{opacity:1}.pose-b,.pose-c{opacity:0}.cursor,.radar{opacity:1}.bubble{opacity:0}
}
</style>
<rect x="1" y="1" width="1098" height="416" rx="15" fill="url(#ocean)" stroke="#35465A" stroke-width="1.7"/>
<rect x="2" y="2" width="1096" height="414" rx="14" fill="url(#grid)"/>
<path d="M18 46H1082" stroke="#344459"/>
<circle cx="30" cy="23" r="5" fill="#DB596F"/><circle cx="49" cy="23" r="5" fill="#E4B46D"/><circle cx="68" cy="23" r="5" fill="#75C1AE"/>
<text x="89" y="28" class="mono" font-size="13" fill="#B5C4D3">francisco@salty-siren: ~/abyss</text>
<circle cx="925" cy="23" r="4" fill="#ED7885" class="radar"/>
<text x="937" y="27" class="mono" font-size="12" fill="#E69EA5">ARTISTIC SIMULATION</text>
<path d="M661 65V391" stroke="#34475C"/>
<text x="29" y="80" class="mono" font-size="16" font-weight="700" letter-spacing="2" fill="#F38B98">[  RELEASE THE KRAKEN  ]</text>
<text x="29" y="101" class="mono" font-size="12" fill="#87A3B8">ABYSSAL ASCII ENGINE  /  CREATIVE MODE</text>
