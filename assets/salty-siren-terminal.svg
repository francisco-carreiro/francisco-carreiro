<text x="11" y="352" xml:space="preserve" class="wave wave-back">~~~ ~~ ~~~~~ ~~ ~~~~~~~ ~~ ~~~~~~ ~~~ ~~ ~~~~~ ~~ ~~~~~~~ ~~~~~~ ~~</text>
<text x="-6" y="378" xml:space="preserve" class="wave wave-front">~==~~ =~= ~~==~~ ~~~=~ ==~~ ~==~~ ~~==~~ ~~~=~ ==~~ ~==~~</text>
