<rect x="685" y="83" width="383" height="289" rx="10" fill="#0A111D" stroke="#33485A"/>
<path d="M686 121H1067" stroke="#2F4154"/>
<text x="705" y="109" class="mono" font-size="13" font-weight="700" fill="#BFD3E1">ABYSS / COMMAND CONSOLE</text>
<text x="705" y="148" class="mono" font-size="14" fill="#F18491">$ <tspan fill="#DCE8F4">./release --kraken</tspan></text>
<text x="705" y="184" class="mono" font-size="13" fill="#A0B5C7">[00] sea_level: rising...</text>
